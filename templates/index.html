<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const MODE_COLORS = {
        "driving-car": "#ff4500",   
        "cycling-regular": "#2ecc71",   
        "foot-walking": "#9b59b6"   
    }

    const MODE_LABELS = {
        "driving-car": "Driving",
        "cycling-regular": "Biking",
        "foot-walking": "Walking"
    }
    const MODE_ORDER = ["driving-car", "cycling-regular", "foot-walking"];

    let selectedMode = "driving-car";
    let modeTraceIndices = {};
    let allRouteTraceIndices = [];
    let routeSteps = {};
    let routeSummaries = {};
    let markersDrawn = false;

    const plotDivInit = document.querySelector(".plotly-graph-div")
    if (plotDivInit) {
        Plotly.relayout(plotDivInit, {
            hoverlabel: {
                bgcolor: "rgba(10,10,10,0.92)",
                bordercolor: "#ff4500",
                font: {color: "white", family: "Open Sans, sans-serif", size: 13}
            }
        });
    }

    function formatDistance(meters) {
        if (meters == null) return "N/A";
        return meters >= 1000 ?`${(meters / 1000).toFixed(1)} km` : `${Math.round(meters)} m`;
    }

    function renderDirections(mode) {
        const panel = document.getElementById("directions-panel");
        const list = document.getElementById("directions-list");
        const summaryEl = document.getElementById("directions-summary");
        const steps = routeSteps[mode];
        const summary = routeSummaries[mode];

        if (!steps || steps.length === 0) {
            panel.style.display = "none";
            return;
        }

        if (summary) {
            summaryEl.textContent =  `${MODE_LABELS[mode]} · ${formatDistance(summary.distance)} · ${formatDuration(summary.duration)}`;
            summaryEl.style.display = "block";
        } else {
            summaryEl.style.display = "none";
        }

        list.innerHTML = "";
        steps.forEach(step => {
            const li = document.createElement("li");
            const distText = step.distance >= 1000
                ? `${(step.distance / 1000).toFixed(1)} km`
                : `${Math.round(step.distance)} m`;
            li.innerHTML = `<span class="step-instruction">${step.instruction}</span><span class="step-distance">${distText}</span>`;
            list.appendChild(li);
        });
        panel.style.display = "block";
    }

    document.getElementById("directions-close").onclick = () => {
        document.getElementById("directions-panel").style.display = "none";
    };

    function formatDuration(seconds) {
        if (seconds == null) return "N/A";
        const mins = Math.round(seconds / 60);
        if (mins < 60) return `${mins} min`;  
        const hrs = Math.floor(mins / 60);
        return `${hrs} hr ${mins % 60} min`;  
    }

    function computeSquareBounds(lats, lons, paddingFactor = 0.4) {
        const minLat = Math.min(...lats);
        const maxLat = Math.max(...lats);
        const minLon = Math.min(...lons);
        const maxLon = Math.max(...lons);

        let span = Math.max(maxLat - minLat, maxLon - minLon);
        if (span === 0) span = 0.05;
        span *= (1 + paddingFactor);

        const centerLat = (minLat + maxLat) / 2;
        const centerLon = (minLon + maxLon) / 2;

        return {
            west: centerLon - span / 2,
            east: centerLon + span / 2,
            south: centerLat - span / 2,
            north: centerLat + span / 2
        };
    }

    function setupAutocomplete(inputId, suggestionsId) {
        const input = document.getElementById(inputId);
        const box = document.getElementById(suggestionsId);
        let debounceTimer;

        input.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            const query = input.value.trim();
            if (query.length < 3) {
                box.innerHTML = "";
                box.style.display = "none";
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`/autocomplete?query=${encodeURIComponent(query)}`);
                    const data = await res.json();

                    box.innerHTML = "";
                    if (data.suggestions.length === 0) {
                        box.style.display = "none";
                        return;
                    }

                    data.suggestions.forEach(s => {
                        const item = document.createElement("div");
                        item.className = "suggestion-item";
                        item.textContent = s.label;
                        item.onclick = () => {
                            input.value = s.label;
                            box.innerHTML = "";
                            box.style.display = "none";

                            if (inputId === "start") {
                                const plotDiv = document.querySelector(".plotly-graph-div");
                                Plotly.relayout(plotDiv, {
                                    "map.center": { lat: s.lat, lon: s.lon },
                                    "map.zoom": 12
                                });
                            }
                        };
                        box.appendChild(item);
                    });
                    box.style.display = "block";
                } catch (err) {
                    box.style.display = "none";
                }
            }, 300);
        });

        document.addEventListener("click", (e) => {
            if (e.target !== input) {
                box.style.display = "none";
            }
        });
    }

    setupAutocomplete("start", "start-suggestions");
    setupAutocomplete("end", "end-suggestions");
    
    document.getElementById("use-location-btn").onclick = () => {
        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your brower.");
            return;
        }
        
        const btn = document.getElementById("use-location-btn");
        btn.disabled = true;
        btn.textContent = "...";

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude, longitude } = pos.coords;
            try{
                const res = await fetch(`/reverse?lat=${latitude}&lon=${longitude}`);
                const data = await res.json();

                document.getElementById("start").value = data.label;

                const plotDiv = document.querySelector(".plotly-graph-div");
                Plotly.relayout(plotDiv, {
                    "map.center": {lat: latitude, lon: longitude},
                    "map.zoom": 12
                });
            } catch (err){
                document.getElementById("start").value = `${latitude}, ${longitude}`;
               
            } finally {
                btn.disabled = false;
                btn.textContent = "📍";
            }
        }, (err) => {
            alert("Could not get your location: " + err.message);
            btn.disabled = false;
            btn.textContent = "📍"; 
        });
    };

    function highlightSelectedMode() {
        const plotDiv = document.querySelector(".plotly-graph-div");
        for (const [mode, indices] of Object.entries(modeTraceIndices)) {
            const isSelected = mode === selectedMode;
            Plotly.restyle(plotDiv, { opacity: isSelected ? 0.9 : 0.25 }, [indices[0]]);
            Plotly.restyle(plotDiv, { opacity: isSelected ? 1 : 0.35 }, [indices[1]]);
        }
    }

    document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.onclick = () => {
            if (btn.disabled) return;
            selectedMode = btn.dataset.mode;
            document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("mode-selected"));
            btn.classList.add("mode-selected");
            highlightSelectedMode();
            renderDirections(selectedMode);
        };
    });

    function clearRoutes() {
        const plotDiv = document.querySelector(".plotly-graph-div");
        if (allRouteTraceIndices.length > 0) {
            Plotly.deleteTraces(plotDiv, allRouteTraceIndices);
        }
        allRouteTraceIndices = [];
        modeTraceIndices = {};
        document.querySelectorAll(".mode-time").forEach(el => el.textContent = "--");
        
        markersDrawn = false;
        routeSteps = {};
        document.getElementById("directions-panel").style.display = "none";
    
    }

    document.getElementById("gps-submit").onclick = async () => {
        const start = document.getElementById("start").value;
        const end = document.getElementById("end").value;

        if (!start || !end) {
            alert("Please enter both a starting location and a destination.");
            return;
        }

        const loading = document.getElementById("loading");
        const submitBtn = document.getElementById("gps-submit");
        loading.style.display = "block";
        submitBtn.disabled = true;
        submitBtn.textContent = "Calculating..."
        clearRoutes();
        try {
            let data;
            try {
                const res = await fetch("/routes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json"},
                    body: JSON.stringify({ start, end })
                });
                data = await res.json();
            } catch (err) {
                alert("Could not calculate routes.");
                return;
            }

            if(data.error) {
                alert(data.error);
                return;
            }

            const plotDiv = document.querySelector(".plotly-graph-div");
            const selector = document.getElementById("mode-selector");
            selector.style.display = "flex";

            let allLats = [];
            let allLons = [];
            let anySuccess = false;

            MODE_ORDER.forEach(mode => {
                const result = data[mode];
                const btn = document.querySelector(`.mode-btn[data-mode="${mode}"]`);
                const timeEl = btn.querySelector(".mode-time");

                if (!result || result.error) {
                    timeEl.textContent = "N/A";
                    btn.disabled = true;
                    btn.classList.add("mode-unavailable");
                    return;
                }

                btn.disabled = false;
                btn.classList.remove("mode-unavailable");
                timeEl.textContent = formatDuration(result.duration);
                anySuccess = true;
                allLats.push(...result.lat);
                allLons.push(...result.lon);

                const color = MODE_COLORS[mode];
                const isSelected = mode === selectedMode;

                if(!markersDrawn && result.start && result.end) {
                    const startMarker = {
                        type: "scattermap",
                        lat: [result.start.lat],
                        lon: [result.start.lon],
                        mode: "markers",
                        marker: { size: 14, color: "#2ecc71"},
                        hovertemplate: `Start: ${start}<extra></extra>`,
                        showlegend: false
                    };
                    const endMarker = {
                        type: "scattermap",
                        lat: [result.end.lat],
                        lon: [result.end.lon],
                        mode: "markers",
                        marker: { size: 14, color: "#e74c3c"},
                        hovertemplate: `Destination: ${end}<extra></extra>`,
                        showlegend: false
                    };
                    const markerStartIdx = plotDiv.data.length;
                    Plotly.addTraces(plotDiv, [startMarker, endMarker ]);
                    allRouteTraceIndices.push(markerStartIdx, markerStartIdx + 1);
                    markersDrawn = true;
                }
                routeSteps[mode] = result.steps || [];
                routeSummaries[mode] = { duration: result.duration, distance: result.distance };
                const startIdx = plotDiv.data.length;            

                const halo = {
                    type: "scattermap",
                    lat: result.lat,
                    lon: result.lon,
                    mode: "lines",
                    line: {color: "white", width: 8},
                    hoverinfo: "skip",
                    showlegend: false,
                    opacity: isSelected ? 0.9 : 0.25
                };

                const line = {
                    type: "scattermap",
                    lat: result.lat,
                    lon: result.lon,
                    mode: "lines",
                    line: { color: color, width: 4},
                    hovertemplate: `${MODE_LABELS[mode]} route from ${start} to ${end}<extra></extra>`,
                    showlegend: false,
                    opacity: isSelected ? 1 : 0.35
                };


                Plotly.addTraces(plotDiv, [halo, line]);
                modeTraceIndices[mode] = [startIdx, startIdx + 1];
                allRouteTraceIndices.push(startIdx, startIdx + 1);
            });

            if(!anySuccess) {
                alert("No safe route could be found for any travel mode, try a different destination");
                return;
            }

            const bounds = computeSquareBounds(allLats, allLons);
            Plotly.relayout(plotDiv, { "map.bounds": bounds });
            renderDirections(selectedMode);  
        } finally {
            loading.style.display = "none"; 
            submitBtn.disabled = false;
            submitBtn.textContent = "Get Route";
        }   
    };

    document.getElementById("clear-route").onclick = clearRoutes;

});
</script>


<body>
     <div id="home-overlay">
        <div id="home-content">
            <h1 id = "app-title"> Firewatch </h1>
            <p id="app-subtitle">A tool for locating and routing around fires.</p>
            <button id="view-map-button" onclick="
                document.getElementById('home-overlay').style.display = 'none';
                document.getElementById('gps-panel').style.display = 'block';
                document.querySelectorAll('g.colorbar').forEach(cb => cb.style.display = 'block');
            ">
                Start Exploring
            </button>
        </div>
    </div>
    <div id="gps-panel">
        <h3>Navigation</h3>

        <div class="field-group">
            <label for="start">Your Location:</label>
            <div class="input-with-button">
                <input type="text" id="start" placeholder="Enter current location" autocomplete="off">
                <button id="use-location-btn" type="button" title="Use my current location" aria-label="Use my current location">📍</button>
            </div>
            <div class="suggestions" id="start-suggestions"></div>
        </div>

        <div class="field-group">
            <label for="end">Destination:</label>
            <input type="text" id="end" placeholder="Enter destination" autocomplete="off">
            <div class="suggestions" id="end-suggestions"></div>
        </div>

        <div id="mode-selector" style="display:none;">
            <button class="mode-btn" data-mode="driving-car"><span class="mode-label">Driving</span><br><span class="mode-time">--</span></button>
            <button class="mode-btn" data-mode="cycling-regular"><span class="mode-label">Biking</span><br><span class="mode-time">--</span></button>
            <button class="mode-btn" data-mode="foot-walking"><span class="mode-label">Walking</span><br><span class="mode-time">--</span></button>
        </div>
        <button id="gps-submit">Get Route</button>

    </div>
    <div id="loading" style="
        display: none;
        position: fixed;
        top: 20px;
        right: 20px;
        background: #0008;
        color: white;
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 9999;
    "> 
        Calculating safe routes...
    </div>

    <button id ="clear-route" style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #222;
        border: none;
        color: white;
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
    ">  
        Clear Route
    </button>
    <div id="directions-panel" style="display:none;">
        <div id ="directions-header">
            <h3>Directions</h3>
            <button id="directions-close" type="button" title="Close directions" aria-label="Close directions">×</button>
        </div>
        <div id = "directions-summary"></div>
        <ol id="directions-list"></ol>
    </div>
    {{ graph_html|safe }}

</body>
</html>
