<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
    let selectedMode = "driving-car";

    function formatDuration(seconds) {
        if (seconds == null) return "N/A";
        const mins = Math.round(seconds / 60);
        if (mins < 60) return `${mins} min`;  // FIXED: was "min" (undefined variable, should be "mins") AND was using single quotes '...' instead of backticks `...`, so it printed the literal text "${mins} min" instead of interpolating
        const hrs = Math.floor(mins / 60);
        return `${hrs} hr ${mins % 60} min`;  // FIXED: same single-quote-vs-backtick issue
    }

    async function fetchEstimates() {
        const start = document.getElementById("start").value;
        const end = document.getElementById("end").value;
        if (!start || !end) return;

        const selector = document.getElementById("mode-selector");
        selector.style.display = "flex";
        document.querySelectorAll(".mode-time").forEach(el => el.textContent = "...");

        try {
            // FIXED: was using single quotes (no interpolation), missing "&" between params (had "$end=" instead of "&end="),
            // and "encodeURLComponent" was misspelled (should be encodeURIComponent)
            const res = await fetch(`/estimates?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
            const data = await res.json();

            document.querySelectorAll(".mode-btn").forEach(btn => {  // FIXED: was "mode-btn" missing the leading "." — querySelectorAll needs a CSS selector, so this matched nothing
                const mode = btn.dataset.mode;
                const timeEl = btn.querySelector(".mode-time");
                if (data[mode] && !data[mode].error) {
                    timeEl.textContent = formatDuration(data[mode].duration);
                } else {
                    timeEl.textContent = "N/A";
                }
            });
        } catch (err) {
            document.querySelectorAll(".mode-time").forEach(el => el.textContent = "N/A");
        }
    }

    document.getElementById("start").addEventListener("blur", fetchEstimates);
    document.getElementById("end").addEventListener("blur", fetchEstimates);

    document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.onclick = () => {
            selectedMode = btn.dataset.mode;
            document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("mode-selected"));
            btn.classList.add("mode-selected");
        };
    });

    function computeSquareBounds(lats, lons, paddingFactor = 0.4) {
        const minLat = Math.min(...lats);
        const maxLat = Math.max(...lats);
        const minLon = Math.min(...lons);
        const maxLon = Math.max(...lons);

        let span = Math.max(maxLat - minLat, maxLon - minLon);
        if (span === 0) span = 0.05;
        span *= (1 + paddingFactor);

        const centerLat = (minLat + maxLat) / 2;
        const centerLon = (minLon + maxLon) / 2;

        return {
            west: centerLon - span / 2,
            east: centerLon + span / 2,
            south: centerLat - span / 2,
            north: centerLat + span / 2
        };
    }

    function setupAutocomplete(inputId, suggestionsId) {
        const input = document.getElementById(inputId);
        const box = document.getElementById(suggestionsId);
        let debounceTimer;

        input.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            const query = input.value.trim();
            if (query.length < 3) {
                box.innerHTML = "";
                box.style.display = "none";
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`/autocomplete?query=${encodeURIComponent(query)}`);
                    const data = await res.json();

                    box.innerHTML = "";
                    if (data.suggestions.length === 0) {
                        box.style.display = "none";
                        return;
                    }

                    data.suggestions.forEach(s => {
                        const item = document.createElement("div");
                        item.className = "suggestion-item";
                        item.textContent = s.label;
                        item.onclick = () => {
                            input.value = s.label;
                            box.innerHTML = "";
                            box.style.display = "none";

                            if (inputId === "start") {
                                const plotDiv = document.querySelector(".plotly-graph-div");
                                Plotly.relayout(plotDiv, {
                                    "map.center": { lat: s.lat, lon: s.lon },
                                    "map.zoom": 12
                                });
                            }
                        };
                        box.appendChild(item);
                    });
                    box.style.display = "block";
                } catch (err) {
                    box.style.display = "none";
                }
            }, 300);
        });

        document.addEventListener("click", (e) => {
            if (e.target !== input) {
                box.style.display = "none";
            }
        });
    }

    setupAutocomplete("start", "start-suggestions");
    setupAutocomplete("end", "end-suggestions");

    document.getElementById("gps-submit").onclick = async () => {
        const start = document.getElementById("start").value;
        const end = document.getElementById("end").value;

        const loading = document.getElementById("loading");
        loading.style.display = "block";

        let route;
        try {
            const res = await fetch("/route", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ start, end, mode: selectedMode })
            });

            route = await res.json();

            if (!route.lat || route.lat.length === 0) {
                alert(route.error || "No safe route found. Try a different destination.");
                loading.style.display = "none";
                return;
            }

            const routeHalo = {
                type: "scattermap",
                lat: route.lat,
                lon: route.lon,
                mode: "lines",
                line: { color: "white", width: 8 },
                hoverinfo: "skip",
                showlegend: false,  // ADDED: this trace also has a "name"-less default, but explicitly hiding it keeps the legend fully off
                name: "Route Halo"
            };

            const routeTrace = {
                type: "scattermap",
                lat: route.lat,
                lon: route.lon,
                mode: "lines",
                line: { color: "#1e90ff", width: 4 },
                name: `Route from ${start} to ${end}`,  // FIXED: was single quotes '...' (no interpolation) instead of backticks
                hoverinfo: "name",
                showlegend: false
            };

            const plotDiv = document.querySelector(".plotly-graph-div");
            Plotly.addTraces(plotDiv, [routeHalo, routeTrace]);

            const bounds = computeSquareBounds(route.lat, route.lon);
            Plotly.relayout(plotDiv, { "map.bounds": bounds });

        } catch (err) {
            alert("Could not calculate a safe route.");
            loading.style.display = "none";
            return;
        }

        loading.style.display = "none";
    };

    document.getElementById("clear-route").onclick = () => {
        const plotDiv = document.querySelector(".plotly-graph-div");
        const n = plotDiv.data.length;
        Plotly.deleteTraces(plotDiv, [n - 2, n - 1]);
    };
});
</script>


<body>
     <div id="home-overlay">
        <div id="home-content">
            <h1 id = "app-title"> Firewatch </h1>
            <p id="app-subtitle">A tool for locating and routing around fires.</p>
            <button id="view-map-button" onclick="
                document.getElementById('home-overlay').style.display = 'none';
                document.getElementById('gps-panel').style.display = 'block';
                document.querySelectorAll('g.colorbar').forEach(cb => cb.style.display = 'block');
            ">
                Start Exploring
            </button>
        </div>
    </div>
    <div id="gps-panel">
        <h3>Navigation</h3>
        <label for ="start">Your Location:</label>
        <input type="text" id="start" placeholder="Enter current location" autocomplete="off">
        <div class="suggestions" id="start-suggestions"></div>

        <label for="end">Destination:</label>
        <input type="text" id="end" placeholder="Enter destination" autocomplete="off">
        <div class="suggestions" id="end-suggestions"></div>

        <!-- FIXED: each button was missing the closing ">" after data-mode="...", so "CAR"/"BIKE"/"WALK"
             were being parsed as stray invalid HTML attributes instead of visible button text -->
        <div id="mode-selector" style="display:none;">
            <button class="mode-btn" data-mode="driving-car">CAR<br><span class="mode-time">--</span></button>
            <button class="mode-btn" data-mode="cycling-regular">BIKE<br><span class="mode-time">--</span></button>
            <button class="mode-btn" data-mode="foot-walking">WALK<br><span class="mode-time">--</span></button>
        </div>
        <button id="gps-submit">Get Route</button>

    </div>
    <div id="loading" style="
        display: none;
        position: fixed;
        top: 20px;
        right: 20px;
        background: #0008;
        color: white;
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 9999;
    "> 
        Calculating safe route...
    </div>

    <button id ="clear-route" style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #222;
        border: none;
        color: white;
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
    ">  
        Clear Route
    </button>

    {{ graph_html|safe }}
    
</body>
</html>
